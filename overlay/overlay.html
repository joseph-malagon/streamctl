<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stream Overlay</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.6.1/socket.io.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }

  /* ── Alert Container ── */
  #alert-container {
    position: absolute;
    top: 40px;
    right: 40px;
    width: 420px;
    pointer-events: none;
  }

  .alert-box {
    background: linear-gradient(135deg, rgba(13,13,20,0.95), rgba(19,19,31,0.95));
    border: 1px solid rgba(124,92,252,0.4);
    border-radius: 16px;
    padding: 18px 22px;
    backdrop-filter: blur(20px);
    box-shadow: 0 8px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
    display: flex;
    align-items: center;
    gap: 14px;
    opacity: 0;
    transform: translateX(100px);
  }

  .alert-icon {
    font-size: 32px;
    flex-shrink: 0;
    filter: drop-shadow(0 0 8px rgba(255,255,255,0.3));
  }

  .alert-content { flex: 1; min-width: 0; }

  .alert-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    margin-bottom: 3px;
  }

  .alert-name {
    font-size: 22px;
    font-weight: 700;
    color: white;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 0 0 20px rgba(124,92,252,0.8);
  }

  .alert-sub {
    font-size: 12px;
    color: rgba(255,255,255,0.5);
    margin-top: 2px;
  }

  /* ── Accent bar ── */
  .alert-bar {
    position: absolute;
    top: 0; left: 0;
    width: 3px;
    height: 100%;
    border-radius: 16px 0 0 16px;
    background: linear-gradient(180deg, #7c5cfc, #fc5c9c);
  }

  /* ── Text popup (center screen) ── */
  #text-container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    text-align: center;
  }

  .text-popup {
    display: inline-block;
    font-size: 56px;
    font-weight: 900;
    color: white;
    text-shadow:
      0 0 20px rgba(124,92,252,0.9),
      0 0 60px rgba(124,92,252,0.5),
      2px 2px 0 rgba(0,0,0,0.8);
    padding: 10px 30px;
    opacity: 0;
    letter-spacing: -0.02em;
  }

  /* ── Particle canvas ── */
  #particle-canvas {
    position: absolute;
    top: 0; left: 0;
    width: 1920px;
    height: 1080px;
    pointer-events: none;
  }

  /* ── Animations ── */

  /* slideIn */
  @keyframes slideIn {
    0%   { opacity: 0; transform: translateX(100px); }
    15%  { opacity: 1; transform: translateX(0); }
    80%  { opacity: 1; transform: translateX(0); }
    100% { opacity: 0; transform: translateX(60px); }
  }

  /* bounce */
  @keyframes bounceIn {
    0%   { opacity: 0; transform: scale(0.3) translateY(-40px); }
    40%  { opacity: 1; transform: scale(1.15) translateY(0); }
    60%  { transform: scale(0.95); }
    75%  { transform: scale(1.05); }
    85%  { transform: scale(0.97); }
    95%  { transform: scale(1.02); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes bounceOut {
    0%   { opacity: 1; transform: scale(1); }
    30%  { transform: scale(1.1); }
    100% { opacity: 0; transform: scale(0.5) translateY(40px); }
  }

  /* textSlide */
  @keyframes textSlide {
    0%   { opacity: 0; transform: translateY(-60px) scale(0.8); }
    20%  { opacity: 1; transform: translateY(0) scale(1); }
    75%  { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(40px) scale(0.9); }
  }

  /* rainbow */
  @keyframes rainbowText {
    0%   { filter: hue-rotate(0deg);   opacity: 0; transform: scale(0.8); }
    10%  { opacity: 1;                  transform: scale(1.1); }
    50%  { filter: hue-rotate(180deg); transform: scale(1); }
    90%  { opacity: 1;                  filter: hue-rotate(320deg); }
    100% { opacity: 0;                  filter: hue-rotate(360deg); transform: scale(0.9); }
  }

  /* explosion */
  @keyframes explosionPop {
    0%   { opacity: 0; transform: scale(0) rotate(-10deg); }
    25%  { opacity: 1; transform: scale(1.3) rotate(3deg); }
    40%  { transform: scale(0.95) rotate(-1deg); }
    55%  { transform: scale(1.05) rotate(1deg); }
    70%  { transform: scale(1) rotate(0); opacity: 1; }
    100% { opacity: 0; transform: scale(1.4) rotate(5deg); }
  }
</style>
</head>
<body>

<canvas id="particle-canvas"></canvas>
<div id="alert-container"></div>
<div id="text-container"></div>

<script>
const socket = io('http://localhost:9000');

socket.on('animate', (data) => {
  const { text, style, username, type } = data;

  if (style === 'slideIn') showAlert(text, username, style);
  else if (style === 'bounce') showTextPopup(text, 'bounce');
  else if (style === 'explosion') { showTextPopup(text, 'explosion'); spawnParticles('explosion'); }
  else if (style === 'rainbow') showTextPopup(text, 'rainbow');
  else showAlert(text, username, 'slideIn'); // default
});

// ── Alert (top right) ──────────────────────────────────────────────────────
function showAlert(text, username, style) {
  const container = document.getElementById('alert-container');
  const box = document.createElement('div');
  box.className = 'alert-box';
  box.style.position = 'relative';

  const label = text.includes('{user}') || !text ? 'New Event' : '';
  const displayText = text.replace('{user}', username || '');
  const displayName = username || displayText;

  box.innerHTML = `
    <div class="alert-bar"></div>
    <div class="alert-icon">✨</div>
    <div class="alert-content">
      ${label ? `<div class="alert-label">${label}</div>` : ''}
      <div class="alert-name">${displayName}</div>
      ${displayText && displayText !== displayName ? `<div class="alert-sub">${displayText}</div>` : ''}
    </div>
  `;

  container.appendChild(box);
  box.style.animation = 'slideIn 4s cubic-bezier(0.22, 1, 0.36, 1) forwards';

  setTimeout(() => { if (box.parentNode) box.remove(); }, 4200);
}

// ── Text Popup (center) ────────────────────────────────────────────────────
function showTextPopup(text, style) {
  const container = document.getElementById('text-container');
  const el = document.createElement('div');
  el.className = 'text-popup';

  const displayText = text || '✨';
  el.textContent = displayText;

  const animations = {
    bounce:    'bounceIn 0.6s cubic-bezier(0.34,1.56,0.64,1) forwards, bounceOut 0.5s ease-in 3.5s forwards',
    explosion: 'explosionPop 4.5s cubic-bezier(0.34,1.56,0.64,1) forwards',
    rainbow:   'rainbowText 4.5s ease-in-out forwards'
  };

  el.style.animation = animations[style] || animations.bounce;
  container.appendChild(el);
  setTimeout(() => { if (el.parentNode) el.remove(); }, 5000);
}

// ── Particles ──────────────────────────────────────────────────────────────
function spawnParticles(type) {
  const canvas = document.getElementById('particle-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = 1920;
  canvas.height = 1080;

  const colors = ['#7c5cfc','#fc5c9c','#3ddc84','#ffd166','#06d6a0','#ef476f'];
  const particles = [];
  const count = 120;

  const cx = canvas.width / 2;
  const cy = canvas.height / 2;

  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 4 + Math.random() * 14;
    particles.push({
      x: cx, y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 3,
      color: colors[Math.floor(Math.random() * colors.length)],
      size: 4 + Math.random() * 8,
      life: 1,
      decay: 0.012 + Math.random() * 0.015,
      shape: Math.random() > 0.5 ? 'circle' : 'rect'
    });
  }

  let animId;
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = false;
    for (const p of particles) {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.4;
      p.life -= p.decay;
      if (p.life <= 0) continue;
      alive = true;
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      if (p.shape === 'circle') {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.life * 10);
        ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
        ctx.restore();
      }
    }
    ctx.globalAlpha = 1;
    if (alive) animId = requestAnimationFrame(draw);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  draw();
  setTimeout(() => { cancelAnimationFrame(animId); ctx.clearRect(0,0,canvas.width,canvas.height); }, 5000);
}
</script>
</body>
</html>
